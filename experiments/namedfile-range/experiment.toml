name = "namedfile-range"
description = "Range requests on plone.namedfile @@download, with and without PR #226"
python = "3.12"
constraints = "https://dist.plone.org/release/6.2-latest/constraints.txt"
requirements = ["requirements/plone.txt", "requirements/servers.txt"]
servers = ["waitress", "bjoern", "pyruvate", "gunicorn", "uwsgi", "cheroot"]
file_size = 67108864  # 64 MiB

# Installed in every variant, on top of the constraints.
[overrides]
gunicorn = "==26.2.0"  # the constraints pin 26.2.2, which is not on PyPI

[variants.main]
description = "plone.namedfile origin/main (2010c04)"
[variants.main.overrides]
"plone.namedfile" = "git+file:///home/mauro/Work/plone/plone.namedfile@2010c047e53ce3f74a96e21692e4ea4d7a169ede"

[variants.pr]
description = "plone.namedfile PR #226 (6fd9c5d)"
[variants.pr.overrides]
"plone.namedfile" = "git+file:///home/mauro/Work/plone/plone.namedfile@6fd9c5d"

[variants.pr-fileno]
description = "PR #226 plus fileno() on the iterator, so servers can use sendfile"
patches = ["patches/fileno.patch"]
[variants.pr-fileno.overrides]
"plone.namedfile" = "git+file:///home/mauro/Work/plone/plone.namedfile@6fd9c5d"

[variants.pr-fileno-whole]
description = "PR #226 plus fileno() only when the whole file is requested"
patches = ["patches/fileno-whole-file.patch"]
[variants.pr-fileno-whole.overrides]
"plone.namedfile" = "git+file:///home/mauro/Work/plone/plone.namedfile@6fd9c5d"

[variants.pr-fileno-whole-iter]
description = "pr-fileno-whole plus partial ranges as a plain iterator, so Zope does not use wsgi.file_wrapper for them"
patches = ["patches/fileno-whole-file.patch", "patches/partial-range-iterate.patch"]
[variants.pr-fileno-whole-iter.overrides]
"plone.namedfile" = "git+file:///home/mauro/Work/plone/plone.namedfile@6fd9c5d"
